services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: wa
      POSTGRES_DB: wa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # opcional: sobe so com `docker compose --profile media up -d`
  minio:
    image: minio/minio:latest
    profiles: ["media"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  wa-gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":3000"
      PUBLIC_URL: "http://localhost:3000"
      DATABASE_URL: "postgres://wa:wa@postgres:5432/wa?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      API_KEY: "dev-master-key"
      LOG_LEVEL: "info"
      LOG_FORMAT: "text"
      OUTBOX_MIN_INTERVAL: "3s"
      OUTBOX_JITTER: "2s"
      # descomente para ligar a midia (precisa do profile "media"):
      # MEDIA_BACKEND: "s3"
      # S3_ENDPOINT: "minio:9000"
      # S3_BUCKET: "wa-media"
      # S3_ACCESS_KEY: "minioadmin"
      # S3_SECRET_KEY: "minioadmin"
      # S3_PATH_STYLE: "true"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
