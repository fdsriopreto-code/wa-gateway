services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: wa
      POSTGRES_DB: wa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # opcional: storage de mídia S3-compatível (https://github.com/fdsriopreto-code/gostore-s3).
  # sobe so com `docker compose --profile media up -d`
  # console: http://localhost:9001 (login com GOSTORE_ROOT_USER / _PASSWORD)
  gostore:
    image: ghcr.io/fdsriopreto-code/gostore-s3:0.9.0
    profiles: ["media"]
    environment:
      GOSTORE_ROOT_USER: gostoreadmin
      GOSTORE_ROOT_PASSWORD: troque-esta-senha-forte
      GOSTORE_REGION: us-east-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gostoredata:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/gostore", "version"]
      interval: 10s
      timeout: 5s
      retries: 10

  wa-gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":3000"
      PUBLIC_URL: "http://localhost:3000"
      DATABASE_URL: "postgres://wa:wa@postgres:5432/wa?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      API_KEY: "dev-master-key"
      LOG_LEVEL: "info"
      LOG_FORMAT: "text"
      OUTBOX_MIN_INTERVAL: "3s"
      OUTBOX_JITTER: "2s"
      # descomente para ligar a midia (precisa do profile "media"):
      # MEDIA_BACKEND: "s3"
      # S3_ENDPOINT: "gostore:9000"
      # S3_BUCKET: "wa-media"
      # S3_ACCESS_KEY: "gostoreadmin"
      # S3_SECRET_KEY: "troque-esta-senha-forte"
      # S3_PATH_STYLE: "true"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  gostoredata:
