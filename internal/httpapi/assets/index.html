<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>wa-gateway · console</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%2325d366'/><text x='50' y='73' font-size='58' text-anchor='middle' fill='%2303130a' font-family='sans-serif' font-weight='bold'>w</text></svg>">
</head>
<body>
  <div id="scrim" class="scrim"></div>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">w</div>
        <div class="txt">wa-gateway<small>console</small></div>
        <button class="kbd-btn" id="kbd-hint" title="Busca rápida (Ctrl/⌘ K)"><kbd>⌘K</kbd></button>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot" id="foot"></div>
    </aside>
    <main class="content">
      <header class="topbar">
        <div class="lft">
          <button id="menu-btn" class="btn ghost icon sm" title="Menu">☰</button>
          <h1 id="crumb"></h1>
        </div>
        <div class="right">
          <span id="health" class="pill"><span class="dot"></span>…</span>
          <button id="refresh" class="btn ghost icon sm" title="Recarregar">↻</button>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="app.js"></script>
</body>
</html>
