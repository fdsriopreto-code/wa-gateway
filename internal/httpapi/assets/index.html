<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>wa-gateway · console</title>
  <link rel="stylesheet" href="styles.css">

  <div id="modal-root"></div>

</html>
